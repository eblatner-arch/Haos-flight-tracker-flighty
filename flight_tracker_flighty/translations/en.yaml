configuration:
  ics_file_path:
    name: Schedule file
    description: The feed copy ICS2GCAL saves (turn on save_feed_copy there). Default /homeassistant/ics2gcal/feed.ics.
  airline_icao:
    name: Your airline (ICAO)
    description: Three-letter code added to flight numbers in your schedule, e.g. UAL for United. Titles that already carry a code (DH AA 312) use that one.
  notify_service:
    name: Notify service
    description: Your phone's notify service without "notify.", e.g. mobile_app_erics_iphone. Blank sends alerts to Home Assistant notifications instead.
  notification_url:
    name: Notification link (optional)
    description: "Where tapping a push opens. Blank: the Flights panel in the Home Assistant app. The add-on's own web address (e.g. http://homeassistant.local:8099/, needs the 8099 port set): opens in Safari straight on that flight's page. Another app's link (e.g. shortcuts://run-shortcut?name=Flighty): opens that app."
  aeroapi_key:
    name: AeroAPI key (optional)
    description: FlightAware AeroAPI Personal key. Used a few times per flight (yours and followed) for the airline's tail assignment and inbound flight. Blank turns it off.
  aeroapi_monthly_budget:
    name: AeroAPI monthly budget ($)
    description: Stops calling AeroAPI once this month's queries would cost more than this. The Personal tier includes $5 free a month.
  aeroapi_cost_per_query:
    name: AeroAPI cost per query ($)
    description: Advanced. Used to count spend against the budget. Default 0.005.
  aeroapi_max_per_leg:
    name: AeroAPI max queries per flight
    description: Advanced. Default 6.
  gemini_api_key:
    name: Gemini API key (optional)
    description: Only for the screenshot fallback when FlightAware's page data can't be read. Free key at aistudio.google.com/apikey.
  gemini_model:
    name: Gemini model
    description: Flash-Lite is cheapest and fast enough.
  google_client_id:
    name: Google client ID (optional, for Drive backup)
    description: An OAuth client of the "TVs and Limited Input devices" type from your own Google Cloud project, with the Drive API on. The same client as the OOOI Flight Logger works. Then Settings → Backup → Connect Google in the app.
  google_client_secret:
    name: Google client secret
    description: That client's secret.
  drive_folder:
    name: Drive folder
    description: Folder the backup goes in. Default "Flight Tracker Flighty (Home Assistant)".
  enable_viewer:
    name: Enable browser viewer
    description: Serve the tracker's browser over noVNC on port 6081 (to clear a CAPTCHA or sign in to FlightAware).
  viewer_password:
    name: Viewer password
    description: Required for the viewer to start. VNC only uses the first 8 characters.
  flight_regex:
    name: Custom flight pattern
    description: Advanced. A regular expression with named groups dep, arr and optionally flt, if your schedule titles aren't recognised.
  home_timezone:
    name: Home time zone
    description: Leave blank to use Home Assistant's. Only used for schedule times without a zone.
  swim_username:
    name: FAA SWIM username (optional)
    description: From your SWIFT portal subscription (portal.swim.faa.gov → Subscriptions → your TFMS subscription → Details), "Connection Username". Blank turns SWIM off.
  swim_password:
    name: FAA SWIM password
    description: That subscription's "Connection Password".
  swim_queue:
    name: FAA SWIM queue
    description: That subscription's "Queue Name", e.g. you.TFMS.747b…​.OUT
  swim_host:
    name: FAA SWIM connection URL
    description: Advanced. Default tcps://ems1.swim.faa.gov:55443.
  swim_vpn:
    name: FAA SWIM message VPN
    description: Advanced. Default TFMS.
  swim_skip_cert_check:
    name: Skip SWIM certificate check
    description: Advanced. Only if the connection fails with a certificate error.
  swim_tfdm_queue:
    name: FAA SWIM TFDM queue (optional)
    description: Your TFDM subscription's "Queue Name" (Subscriptions → TFDM → JumpStart tab). Blank leaves TFDM off.
  swim_tfdm_vpn:
    name: FAA SWIM TFDM message VPN
    description: The TFDM subscription's "Message VPN" from its JumpStart tab.
  swim_tfdm_host:
    name: FAA SWIM TFDM connection URL
    description: The TFDM subscription's "JMS Connection URL". Default tcps://ems3.swim.faa.gov:55443.
  swim_tfdm_username:
    name: FAA SWIM TFDM username
    description: Only if it differs from the TFMS one.
  swim_tfdm_password:
    name: FAA SWIM TFDM password
    description: The TFDM subscription's own "Connection Password" (each subscription has its own). Blank uses the TFMS one.
  swim_stdds_queue:
    name: FAA SWIM STDDS queue (optional)
    description: Your STDDS subscription's "Queue Name". Surface positions at your flights' airports show on the flight's map. Blank leaves STDDS off.
  swim_stdds_vpn:
    name: FAA SWIM STDDS message VPN
    description: The STDDS subscription's "Message VPN" (STDDS).
  swim_stdds_host:
    name: FAA SWIM STDDS connection URL
    description: The STDDS subscription's "JMS Connection URL". Default tcps://ems2.swim.faa.gov:55443.
  swim_stdds_username:
    name: FAA SWIM STDDS username
    description: Only if it differs from the TFMS one.
  swim_stdds_password:
    name: FAA SWIM STDDS password
    description: The STDDS subscription's own "Connection Password". Blank uses the TFMS one.
  map_api_key:
    name: Map tiles API key (optional)
    description: Your free CARTO basemap key (carto.com/basemaps/apikey). Without one CARTO marks the map tiles "API key required". It's used by your browser to load the maps.
  map_tile_url:
    name: Map tile address (optional)
    description: Advanced. A tile address from your provider, e.g. https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key={key} ({style} becomes dark_all or light_all, {key} the key above).
