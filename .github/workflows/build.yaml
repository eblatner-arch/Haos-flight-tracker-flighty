name: Build add-on image

on:
  push:
    branches: [main]
    paths: ["flight_tracker_flighty/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

concurrency:
  group: build-flighty
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          v=$(python3 -c "import yaml;print(yaml.safe_load(open('flight_tracker_flighty/config.yaml'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + aarch64)
        uses: docker/build-push-action@v6
        with:
          context: flight_tracker_flighty
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.hass.version=${{ steps.v.outputs.version }}
            io.hass.type=app
          tags: |
            ghcr.io/eblatner-arch/flight-tracker-flighty:${{ steps.v.outputs.version }}
            ghcr.io/eblatner-arch/flight-tracker-flighty:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
