configuration:
  ics_file_path:
    name: Schedule file
    description: The feed copy ICS2GCAL saves (turn on save_feed_copy there). Default /homeassistant/ics2gcal/feed.ics.
  airline_icao:
    name: Your airline (ICAO)
    description: Three-letter code added to flight numbers in your schedule, e.g. UAL for United. Titles that already carry a code (DH AA 312) use that one.
  notify_service:
    name: Notify service
    description: Your phone's notify service without "notify.", e.g. mobile_app_erics_iphone. Blank sends alerts to Home Assistant notifications instead.
  watch_hours:
    name: Start watching (hours before departure)
    description: Nothing runs for a flight before this. At this point the first look is AeroAPI (if set up), then page checks. Default 18.
  track_deadheads:
    name: Track deadheads
    description: Also watch flights marked DH in your schedule.
  track_flights:
    name: Also follow
    description: Other flights to follow, by flight number (UA1234 or UAL1234), e.g. family. Shown under Following.
  gate_alert_hours:
    name: Gate alerts from (hours before departure)
    description: Gates are tracked all along but only pushed from this many hours before departure; changes after that push right away. 0 pushes any time. Delays, cancellations and inbound problems always push.
  swap_alert_hours:
    name: Aircraft swap alerts from (hours before departure)
    description: Tail changes are tracked all along but only pushed from this many hours before departure. 0 pushes any time.
  inbound_alert_minutes:
    name: Inbound alerts only for turns under (minutes)
    description: Inbound pushes (departed, running late, at the gate) only when the inbound is scheduled to land within this many minutes of your scheduled departure. A cancelled or diverted inbound always pushes. The inbound is still shown in the app. 0 always pushes.
  delay_threshold_minutes:
    name: Delay alert threshold
    description: Push when the departure is this many minutes late.
  delay_step_minutes:
    name: Delay change step
    description: Push again when the delay changes by at least this many minutes.
  min_turn_minutes:
    name: Minimum turn
    description: Warn when the inbound aircraft is due less than this many minutes before your departure.
  notify_watch_start:
    name: Alert when tracking starts
    description: One push with the departure time, gate and aircraft when a flight enters the watch window.
  notify_inbound_progress:
    name: Inbound aircraft updates
    description: Push when your inbound aircraft departs and when it reaches the gate.
  notify_progress:
    name: Progress alerts on working legs
    description: Push off-block, takeoff, landing and on-block for flights you're operating.
  notify_progress_deadhead:
    name: Progress alerts on deadheads and followed flights
    description: Push off-block, takeoff, landing and on-block for deadheads and followed flights.
  time_sensitive:
    name: Time-sensitive pushes
    description: Delays, gate changes, tight turns, cancellations and NAS programs break through Focus on iPhone.
  poll_far_minutes:
    name: Check interval (more than 3 h out)
  poll_near_minutes:
    name: Check interval (within 3 h)
  poll_fast_minutes:
    name: Check interval (last 45 min, taxi and airborne)
  nas_minutes:
    name: NAS status interval
  live_positions:
    name: Live ADS-B positions
    description: Use adsb.lol for up-to-the-minute aircraft positions on the map while taxiing or airborne.
  aeroapi_key:
    name: AeroAPI key (optional)
    description: FlightAware AeroAPI Personal key. Used a few times per flight (yours and followed) for the airline's tail assignment and inbound flight. Blank turns it off.
  aeroapi_monthly_budget:
    name: AeroAPI monthly budget ($)
    description: Stops calling AeroAPI once this month's queries would cost more than this. The Personal tier includes $5 free a month.
  aeroapi_cost_per_query:
    name: AeroAPI cost per query ($)
    description: Advanced. Used to count spend against the budget. Default 0.005.
  aeroapi_max_per_leg:
    name: AeroAPI max queries per flight
    description: Advanced. Default 6.
  gemini_api_key:
    name: Gemini API key (optional)
    description: Only for the screenshot fallback when FlightAware's page data can't be read. Free key at aistudio.google.com/apikey.
  gemini_model:
    name: Gemini model
    description: Flash-Lite is cheapest and fast enough.
  enable_viewer:
    name: Enable browser viewer
    description: Serve the tracker's browser over noVNC on port 6080 (to clear a CAPTCHA or sign in to FlightAware).
  viewer_password:
    name: Viewer password
    description: Required for the viewer to start. VNC only uses the first 8 characters.
  flight_regex:
    name: Custom flight pattern
    description: Advanced. A regular expression with named groups dep, arr and optionally flt, if your schedule titles aren't recognised.
  home_timezone:
    name: Home time zone
    description: Leave blank to use Home Assistant's. Only used for schedule times without a zone.
