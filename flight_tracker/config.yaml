name: Flight Tracker
version: "3.15.2"
slug: flight_tracker
description: Flighty-style tracking for your crew schedule — gates, delays, inbound aircraft, NAS status and a live map, with push alerts
url: https://github.com/eblatner-arch/haos-flight-tracker
image: ghcr.io/eblatner-arch/flight-tracker
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:airplane
panel_title: Flights
homeassistant_api: true
hassio_api: true
map:
  - homeassistant_config:ro
  - type: share
    read_only: false
ports:
  6080/tcp: 6080
  8099/tcp: null
ports_description:
  6080/tcp: Live browser viewer (noVNC)
  8099/tcp: "Direct web access to the app without a Home Assistant login (leave blank unless you need it)"
options:
  ics_file_path: /homeassistant/ics2gcal/feed.ics
  airline_icao: ""
  notify_service: ""
  aeroapi_key: ""
  aeroapi_monthly_budget: 5
  gemini_api_key: ""
  gemini_model: gemini-flash-lite-latest
  google_client_id: ""
  google_client_secret: ""
  drive_folder: Flight Tracker (Home Assistant)
  enable_viewer: true
  viewer_password: ""
  swim_username: ""
  swim_password: ""
  swim_queue: ""
  swim_tfdm_queue: ""
  swim_tfdm_vpn: TFDM
  swim_tfdm_password: ""
  swim_stdds_queue: ""
  swim_stdds_vpn: STDDS
  swim_stdds_password: ""
schema:
  ics_file_path: str
  airline_icao: str?
  notify_service: str?
  notification_url: str?
  aeroapi_key: password?
  aeroapi_monthly_budget: float(0,1000)
  aeroapi_cost_per_query: float(0,1)?
  aeroapi_max_per_leg: int(1,50)?
  gemini_api_key: password?
  gemini_model: str
  google_client_id: str?
  google_client_secret: password?
  drive_folder: str?
  enable_viewer: bool
  viewer_password: password?
  swim_username: str?
  swim_password: password?
  swim_queue: str?
  swim_host: str?
  swim_vpn: str?
  swim_skip_cert_check: bool?
  swim_tfdm_queue: str?
  swim_tfdm_vpn: str?
  swim_tfdm_host: str?
  swim_tfdm_username: str?
  swim_tfdm_password: password?
  swim_stdds_queue: str?
  swim_stdds_vpn: str?
  swim_stdds_host: str?
  swim_stdds_username: str?
  swim_stdds_password: password?
  flight_regex: str?
  home_timezone: str?
